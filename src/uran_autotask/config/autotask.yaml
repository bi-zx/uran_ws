uran_autotask:
  loop_interval_s: 0.5
  progress_report_interval_s: 2.0
  require_auto_mode: true

  # 经纬度任务点要先投影到 Nav2 的 map 坐标系。
  # 这里先用单锚点方案，适合第一版落地。
  geo_reference:
    enabled: false
    frame_id: "map"
    reference_lat: 0.0
    reference_lon: 0.0
    map_origin_x: 0.0
    map_origin_y: 0.0
    # map x 轴相对 ENU-East 的逆时针角度。
    map_yaw_deg: 0.0
    scale: 1.0

  mission_defaults:
    map_name: ""
    outdoor: false
    localization_source: "laser"
    loop_closure_source: "gps"
    heading_mode: "true_north_deg"

  outdoor_goal_resolver:
    # 局部激光控制器已经负责临时绕障，不再移动后台给出的真实任务点。
    enabled: false
    strategy: "route_tangent_offsets"
    max_attempts_per_point: 7
    search_radii_m: [0.0, 2.0, 5.0, 10.0]
    dedupe_epsilon_m: 0.1
    skip_unreachable_transit: false
    skip_unreachable_nav_points: false

  outdoor_start_alignment:
    enabled: true
    # 室外任务启动前，不再按规划 start 点整体平移路线。
    # 先比较当前位置到第一个巡检点的距离；5m 内直接去第一个巡检点。
    # 超过 5m 时先走 home 点做一次校准；若当前位置到 home 超过 10m，则直接拒绝任务。
    first_inspection_direct_distance_m: 5.0
    home_calibration_accept_distance_m: 5.0
    home_calibration_reject_distance_m: 10.0
    max_pose_age_s: 3.0

  outdoor_pose_aligner:
    enabled: true
    # 第一阶段只估计 GPS 投影点与 Nav2 map 位姿之间的稳定偏移。
    # 该逻辑发生在任务执行过程中，和启动前的起点对齐是两层保护。
    window_size: 8
    min_fix_type: 2
    min_num_sv: 0
    jump_reject_m: 15.0
    visual_support_ratio: 0.5
    min_stable_samples: 2
    max_stable_std_m: 5.0
    enable_goal_correction: true
    max_goal_correction_m: 10.0

  gps_vo_yaw_aligner:
    enabled: true
    # 单天线 GPS 不能静止给机身朝向。这里用“GPS 位移方向”和“本地里程计位移方向”
    # 估计本地 yaw 到 GPS 世界坐标的角度偏移。
    min_fix_type: 3
    min_num_sv: 4
    min_gps_displacement_m: 3.0
    min_visual_displacement_m: 2.0
    # 实际校准行走距离要大于采样门槛，给停车余量和 GPS 采样周期留出空间。
    calibration_drive_distance_m: 4.0
    max_length_ratio_error: 0.6
    max_sample_yaw_delta_deg: 30.0
    smoothing_alpha: 0.1
    gps_jump_reject_m: 10.0
    max_sample_age_s: 20.0
    max_history: 80

  straight_drive:
    enabled: true
    # 只用于“直线行驶一段距离/一段时间”的单步任务，不做全局导航。
    # 相对名会自动加机器狗 namespace，例如 /mi_desktop_48_b0_2d_5f_b6_d0/scan。
    scan_topic: "scan"
    control_hz: 20.0
    default_speed_mps: 0.8
    max_speed_mps: 0.8
    min_avoid_speed_mps: 0.06
    max_angular_speed_radps: 0.7
    heading_kp: 1.4
    slowdown_heading_deg: 55.0
    max_linear_accel_mps2: 0.4
    max_linear_decel_mps2: 0.8
    max_angular_accel_radps2: 1.2
    max_angular_decel_radps2: 1.8
    lookahead_min_m: 0.8
    lookahead_max_m: 2.0
    lookahead_time_s: 0.8
    # mission_planner_route / waypoint / patrol 也统一走这套局部目标点控制。
    # target_tolerance_m 是“到达一个路线点”的局部判定半径，不能用 GPS 校验的大容差。
    target_tolerance_m: 3.0
    target_tolerance_relax_after_s: 30.0
    target_tolerance_relaxed_m: 5.0
    target_tolerance_final_m: 10.0
    goal_confirm_frames: 5
    goal_settle_speed_mps: 0.15
    goal_settle_angular_radps: 0.15
    goal_latch_s: 0.5
    goal_pass_margin_m: 0.35
    route_corridor_half_width_m: 1.5
    turn_in_place_heading_deg: 85.0
    control_pose_timeout_s: 0.30
    scan_timeout_s: 0.35
    blocked_timeout_s: 4.0
    fault_pause_timeout_s: 4.0
    distance_tolerance_m: 0.15
    command_latency_s: 0.15
    brake_decel_mps2: 0.5
    stop_margin_m: 0.25
    max_pose_step_m: 2.0
    usable_fov_deg: 180.0
    obstacle_consider_range_m: 3.0
    robot_radius_m: 0.35
    robot_width_m: 0.70
    safety_margin_m: 0.20
    min_gap_physical_width_m: 1.10
    min_stop_distance_m: 0.65
    clear_path_distance_m: 1.4
    min_gap_width_deg: 28.0
    max_bubble_angle_deg: 35.0
    front_sector_deg: 18.0
    min_scan_valid_ratio: 0.50
    min_front_valid_ratio: 0.50
    degraded_scan_valid_ratio: 0.75
    degraded_front_valid_ratio: 0.75
    degraded_sensor_speed_cap_mps: 0.15
    avoid_direction_lock_s: 1.5
    clear_confirm_s: 0.8
    recover_confirm_s: 0.8
    # 如果 /scan 的 theta=0 不是机器狗正前方，可在这里补偿角度。
    angle_offset_deg: 0.0
    median_window: 5

  pose_report:
    enabled: true
    # ROS 端通过 /uran/core/uplink/data 周期上报当前位置，由 uran_core 转发总后台。
    interval_s: 1.0
    data_type: "robot_pose"
    packet_type: "robot_pose"
    packet_label: "机器狗实时位置"
    robot_id: ""
    # 留空表示自动探测全局 map 位姿话题。
    # 实机上 /dog_pose 可能只有订阅者、没有发布者，不能写死为默认输入。
    map_pose_topic: ""
    map_pose_message_type: "auto"
    map_tf_fallback:
      enabled: true
      target_frame: "map"
      source_frame: "base_link"
    pose_sample_timeout_s: 3.0
    gps_stale_timeout_s: 3.0
    max_visual_pose_age_s: 2.0
    max_time_alignment_error_s: 0.3
    dead_reckoning:
      enabled: true
      # GPS 短时丢失时，使用“最后一次可靠 GPS + 本地里程计增量”外推经纬度。
      # 本地里程计可以是视觉里程计、腿式里程计、融合里程计或 TF。
      # 这不是完整卡尔曼滤波，只是第一版保底定位。
      max_age_s: 30.0
      require_map_pose_anchor: true
      allow_unrotated_visual_fallback: false
      min_fix_type: 2
      min_num_sv: 0
    filter:
      # 长期替换为卡尔曼滤波的配置入口。现在保持关闭，避免没有现场噪声数据时过度自信。
      enabled: false
      mode: "none"
      process_noise_m2: 1.0
      gps_noise_m2: 25.0
      visual_odom_noise_m2: 4.0
    altitude:
      # CyberDog protocol/GpsPayload 当前只有经纬度，没有高度字段。
      # 这里先保留接口，后续接入气压计、RTK 或三维地图高度后再启用。
      enabled: false
      source: "none"

  cyberdog_backend:
    # 统一改为 uran_autotask 自己输出速度控制，不再依赖 algorithm_manager 执行路线点。
    enabled: false
    # 参考 uran_move 的 namespace 配法。
    # 可通过 `ros2 action list | grep start_algo_task` 查看完整路径。
    namespace: "auto"
    start_action_name: "start_algo_task"
    stop_service_name: "stop_algo_task"
    status_service_name: "algo_task_status"
    ready_timeout_s: 5.0
    status_poll_interval_s: 1.0

  gps_monitor:
    enabled: false
    gps_topic: "/ubx/gps_payload"
    status_topic: "/ubx/status"
    status_stale_timeout_s: 5.0
    # 当前位姿上报保持走设备现有“当前机器人位姿”通道。
    map_pose_topic: "dog_pose"
    map_pose_message_type: "auto"
    pose_enable_topic: "pose_enable"
    auto_enable_map_pose_reporting: false
    min_fix_type: 2
    check_interval_s: 3.0
    max_pose_error_m: 15.0
    violation_count_threshold: 2
    on_large_error: "pause"

  visual_pose_monitor:
    enabled: true
    # 历史名称仍叫 visual_pose_monitor，但实际表示“本地里程计监督”。
    # 它可以接视觉里程计、腿式里程计、融合里程计或 TF。
    # 这里默认留空，运行时会优先尝试自动探测：
    # odom_out -> odometry -> pose_filtered -> mivins 候选。
    # 实机已确认 /odom_out 是稳定腿式里程计，类型为 nav_msgs/msg/Odometry。
    # 如果现场系统有明确自定义话题，再手工填这里覆盖自动探测。
    pose_topic: ""
    pose_message_type: "auto"
    tf_fallback:
      enabled: true
      target_frame: "map"
      source_frame: "base_link"
    check_interval_s: 1.5
    max_pose_error_m: 1.5
    max_yaw_error_deg: 20.0
    violation_count_threshold: 2
    on_large_error: "pause"

  camera_capture:
    enabled: true
    namespace: ""
    prefer_take_photo_service: false
    take_photo_service_name: "take_photo"
    camera_service_name: "camera_service"
    ready_timeout_s: 5.0
    width: 1280
    height: 960
    fps: 10

  media_actions:
    record_channel_id: "cyberdog_main"
